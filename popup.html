<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ts3pi</title>
  <!-- Bootstrap CSS CDN -->
  <link 
    rel="stylesheet" 
    href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" 
    integrity="sha384-MEcwR4Gj8R6b6hQKHlTPrb1zqYc/c6I+MtkB0eVYjPztmI0SKuKvdq0Qoa5hDk2K" 
    crossorigin="anonymous"
  >
  <style>
    /* Ensure the popup is wide enough so that the title fits on one line */
    body {
      min-width: 400px;
    }
    /* Style for the status/message area: using the same gray as Bootstrap's secondary background */
    #status {
      background-color: #6c757d;
      color: #fff;
      padding: 10px;
      margin-top: 10px;
      border-radius: 5px;
    }
    /* Footer styling */
    footer {
      margin-top: 20px;
      font-size: 0.9em;
      text-align: center;
      color: #666;
    }
  </style>
  <script src="popup.js"></script>
</head>
<body class="p-3">
  <div class="container">
    <h2 class="mb-3">ts3pi</h2>
    <div class="mb-3">
      <button id="recordBtn" class="btn btn-primary btn-block mb-2">Record page</button>
      <button id="downloadHtmlBtn" class="btn btn-info btn-block mb-2">Open list</button>
      <button id="clearDataBtn" class="btn btn-danger btn-block mb-2">Clear List</button>
    </div>
    <div class="mb-3" style="margin-top: 5px;">
      <button id="downloadJSONBtn" class="btn btn-success btn-block mb-2">Export JSON</button>
      <button id="importJSONBtn" class="btn btn-warning btn-block mb-2">Import JSON</button>
    </div>
    <div id="status" class="text-white">
      &#8505; Info messages will appear here.
    </div>
    <footer class="mt-3">
      This browser extension is created by Apostolos Kritikos (c) 2025. Please find more info at 
      <a href="https://www.softwareresilience.com" target="_blank">https://www.softwareresilience.com</a>.
    </footer>
  </div>

  <!-- Hidden file input for importing JSON -->
  <input type="file" id="importFileInput" accept=".json" style="display: none;" />

  <!-- Bootstrap JS and dependencies -->
  <script 
    src="https://code.jquery.com/jquery-3.5.1.slim.min.js" 
    integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" 
    crossorigin="anonymous">
  </script>
  <script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-LtrjvnR4/JqsxAA2wEpN5P2uK2LsrM2qm3r5iYbDTRZo/OzQ+P/0tIV+XQ0z4J1R" 
    crossorigin="anonymous">
  </script>
</body>
</html>
